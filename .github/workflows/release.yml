name: Release

# Either push a tag (git tag v1.2.0 && git push origin v1.2.0)
# or run this workflow from the Actions tab and enter the version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: printer_fork

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          case "$TAG" in v*) ;; *) echo "::error::Version must start with 'v' (got '$TAG')"; exit 1 ;; esac
          gh release create "$TAG" printer_fork.exe \
            --title "printer_fork $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
